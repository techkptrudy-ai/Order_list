<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistic & Technical Log - Cilegon Shorebase</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary: #00f2ff;
            /* Opacity ultra-halus agar background pesawat terlihat jelas */
            --glass-bg: rgba(255, 255, 255, 0.03); 
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 15px; color: white; min-height: 100vh;
            /* Background Pesawat Take Off */
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1542296332-15a0c8413123?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
        }

        .container {
            max-width: 1300px; margin: auto;
            background: var(--glass-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            padding: 30px; border-radius: 25px; border: 1px solid var(--glass-border);
            box-shadow: 0 15px 60px rgba(0,0,0,0.8);
        }

        h1 { text-align: center; letter-spacing: 5px; color: var(--primary); text-transform: uppercase; font-weight: 300; margin-bottom: 30px; }

        .header-section { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
        .header-section input, .header-section select { flex: 1; min-width: 280px; }

        .form-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px; background: rgba(0,0,0,0.2); padding: 25px; border-radius: 15px;
        }

        input, select { padding: 12px; border-radius: 8px; border: none; background: rgba(255,255,255,0.95); color: #111; font-size: 14px; }
        
        .btn-add {
            grid-column: 1 / -1; background: var(--primary); color: #000; font-weight: bold;
            padding: 15px; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 15px;
        }
        .btn-add:hover { background: #fff; box-shadow: 0 0 25px var(--primary); transform: translateY(-2px); }

        /* Tabel Transparansi Tinggi */
        .table-area { overflow-x: auto; margin-top: 35px; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; background: rgba(255, 255, 255, 0.98); color: #222; }
        th { background: #001d26; color: white; padding: 16px; text-align: left; text-transform: uppercase; font-size: 12px; }
        td { padding: 12px; border-bottom: 1px solid #eee; }

        /* Gallery Foto di Bawah */
        .gallery-container {
            margin-top: 45px; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px;
        }
        .gallery-item {
            background: rgba(255,255,255,0.06); padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); text-align: center;
        }
        .gallery-item img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .gallery-item p { margin: 0; font-size: 11px; color: var(--primary); font-weight: bold; }

        .footer-action { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 40px; }
        .btn-pdf { background: #d00000; color: white; flex: 2; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-reset { background: #333; color: white; flex: 1; padding: 15px; border-radius: 10px; border: none; cursor: pointer; }

        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Logistic & Technical Log</h1>

    <div class="header-section">
        <input type="text" id="judulDoc" placeholder="Keterangan Dokumen / Judul Log">
        <select id="unitAsal">
            <option value="">-- Pilih Unit Kapal --</option>
            <option value="KMP.Legundi">KMP.Legundi</option>
            <option value="KMP.Sebuku">KMP.Sebuku</option>
            <option value="KMP.Batumandi">KMP.Batumandi</option>
            <option value="KMP.Portlink">KMP.Portlink</option>
            <option value="KMP.Portlink III">KMP.Portlink III</option>
            <option value="KMP.Portlink V">KMP.Portlink V</option>
            <option value="KMP.Jatra III">KMP.Jatra III</option>
        </select>
    </div>

    <div class="form-grid">
        <input type="text" id="desc" placeholder="Deskripsi Barang" style="grid-column: span 2;">
        
        <input list="merkList" id="merk" placeholder="Merk">
        <datalist id="merkList">
            <option value="Omron"><option value="Autonics"><option value="Deepsea"><option value="Schneider">
            <option value="Siemens"><option value="Mitsubishi"><option value="ABB">
        </datalist>

        <input type="text" id="type" placeholder="Type / Model">
        <input type="number" id="qty" placeholder="Qty">
        
        <select id="satuan">
            <option value="Pcs">Pcs</option>
            <option value="Pack">Pack</option>
            <option value="Roll">Roll</option>
            <option value="Meter">Meter</option>
            <option value="Botol">Botol</option>
            <option value="Lot">Lot</option>
        </select>

        <input type="file" id="fotoFile" accept="image/*">
        
        <label style="font-size: 11px; color: var(--primary); grid-column: span 2;">Scan TTD Syahrudi (Shorebase):</label>
        <input type="file" id="fotoTTD" accept="image/*" style="grid-column: span 2;">
        
        <button class="btn-add" onclick="addItem()">TAMBAHKAN PERMINTAAN</button>
    </div>

    <div class="table-area">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Deskripsi</th>
                    <th>Merk</th>
                    <th>Type</th>
                    <th>Qty</th>
                    <th>Satuan</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <h3 style="margin-top: 50px; color: var(--primary); border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;">
        <i style="font-size: 0.9em;">Lampiran Dokumentasi</i>
    </h3>
    <div id="galleryArea" class="gallery-container"></div>

    <div class="footer-action">
        <button class="btn-pdf" onclick="exportToPDF()">EXPORT KE PDF (A4)</button>
        <button class="btn-reset" onclick="resetLog()">RESET DATA</button>
    </div>
</div>

<script>
    let logStorage = JSON.parse(localStorage.getItem('marine_order_v4')) || [];
    let shorebaseTTD = localStorage.getItem('shorebase_ttd_v4') || "";

    window.onload = () => refreshUI();

    async function addItem() {
        const fileBarang = document.getElementById('fotoFile').files[0];
        const fileTTD = document.getElementById('fotoTTD').files[0];
        
        let imgBase64 = "";
        if(fileBarang) imgBase64 = await compressImg(fileBarang, 450);

        // Jika ada input TTD baru, simpan ke localStorage
        if(fileTTD) {
            shorebaseTTD = await compressImg(fileTTD, 200); // Ukuran kecil untuk TTD
            localStorage.setItem('shorebase_ttd_v4', shorebaseTTD);
        }

        const data = {
            desc: document.getElementById('desc').value,
            merk: document.getElementById('merk').value,
            type: document.getElementById('type').value,
            qty: document.getElementById('qty').value,
            satuan: document.getElementById('satuan').value,
            foto: imgBase64
        };

        if(!data.desc || !data.qty) return alert("Deskripsi dan Qty wajib diisi!");

        logStorage.push(data);
        localStorage.setItem('marine_order_v4', JSON.stringify(logStorage));
        refreshUI();
        clearForm();
    }

    function compressImg(file, maxW) {
        return new Promise(res => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const scale = maxW / img.width;
                    canvas.width = maxW; canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    res(canvas.toDataURL('image/jpeg', 0.65));
                }
            }
        });
    }

    function refreshUI() {
        const tbody = document.getElementById('tableBody');
        const gall = document.getElementById('galleryArea');
        tbody.innerHTML = ""; gall.innerHTML = "";

        logStorage.forEach((it, i) => {
            tbody.innerHTML += `<tr><td>${i+1}</td><td><b>${it.desc}</b></td><td>${it.merk}</td><td>${it.type}</td><td>${it.qty}</td><td>${it.satuan}</td></tr>`;
            if(it.foto) {
                gall.innerHTML += `<div class="gallery-item"><img src="${it.foto}"><p>Ref Type: ${it.type || '-'}</p></div>`;
            }
        });
    }

    function clearForm() {
        ['desc', 'merk', 'type', 'qty', 'fotoFile', 'fotoTTD'].forEach(id => document.getElementById(id).value = "");
    }

    function resetLog() {
        if(confirm("Hapus semua history log dan TTD Shorebase?")) {
            localStorage.removeItem('marine_order_v4');
            localStorage.removeItem('shorebase_ttd_v4');
            logStorage = []; shorebaseTTD = ""; refreshUI();
        }
    }

    function exportToPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const jdl = document.getElementById('judulDoc').value || "LOG PERMINTAAN";
        const unit = document.getElementById('unitAsal').value || "-";

        // Judul & Header Halaman 1
        doc.setFontSize(16); doc.setTextColor(0, 0, 0); doc.text(jdl, 14, 15);
        doc.setFontSize(10); doc.text(`Asal Unit: ${unit} | Tgl: ${new Date().toLocaleDateString('id-ID')}`, 14, 22);

        // Tabel Data Barang
        const rows = logStorage.map((it, i) => [i+1, it.desc, it.merk, it.type, it.qty, it.satuan]);
        doc.autoTable({
            startY: 28,
            head: [['No', 'Deskripsi', 'Merk', 'Type', 'Qty', 'Satuan']],
            body: rows,
            headStyles: { fillColor: [0, 29, 38] },
            theme: 'striped'
        });

        // Halaman Lampiran Foto (Hanya jika ada)
        const photos = logStorage.filter(it => it.foto);
        if(photos.length > 0) {
            doc.addPage();
            doc.setFontSize(14); doc.text("Lampiran Foto Jenis/contoh Barang", 14, 15);
            let x = 14, y = 25, w = 50, h = 40;
            photos.forEach((it) => {
                if (y + h > 280) { doc.addPage(); y = 20; }
                doc.addImage(it.foto, 'JPEG', x, y, w, h);
                doc.setFontSize(8); doc.text(`Type: ${it.type || '-'}`, x, y + h + 5);
                x += 60; if(x > 150) { x = 14; y += 60; }
            });
        }

        // Halaman Baru Tanda Tangan (TTD)
        doc.addPage();
        doc.setFontSize(14); doc.text("PENGESAHAN DOKUMEN", 14, 15);
        
        let ttdY = 40;
        doc.setFontSize(11);
        doc.text("Dibuat oleh Shorebase,", 14, ttdY);
        
        // Masukkan Gambar TTD (Jika ada)
        if(shorebaseTTD) {
            doc.addImage(shorebaseTTD, 'JPEG', 14, ttdY + 5, 40, 30);
            ttdY += 40;
        } else {
            ttdY += 25; // Ruang kosong jika tidak ada TTD
        }
        
        doc.setFontSize(11); doc.setFont(undefined, 'bold');
        doc.text("Syahrudi", 14, ttdY);
        doc.setFont(undefined, 'normal'); doc.text("Cilegon Shorebase Ops.", 14, ttdY + 5);

        doc.save(`Request_${unit}.pdf`);
    }
</script>
</body>
</html>
