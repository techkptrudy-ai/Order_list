<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order List Part - Marine Logistics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary: #00f2ff;
            --glass-bg: rgba(0, 0, 0, 0.15); 
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 15px; color: white; min-height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), 
                              url('https://images.pexels.com/photos/46148/air-liner-aircraft-air-travel-jet-46148.jpeg?auto=compress&cs=tinysrgb&w=1920');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1250px; 
            background: var(--glass-bg); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            padding: 30px; border-radius: 25px; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            margin: 20px 0;
        }

        h1 { text-align: center; letter-spacing: 6px; color: var(--primary); text-transform: uppercase; font-weight: 300; margin-bottom: 30px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }

        .header-section { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
        .header-section input { flex: 1; min-width: 250px; height: 45px; }

        .form-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px; background: rgba(0,0,0,0.3); padding: 25px; border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        input, select { padding: 12px; border-radius: 8px; border: none; background: rgba(255,255,255,0.95); color: #111; font-size: 14px; }
        
        .btn-add {
            grid-column: 1 / -1; background: var(--primary); color: #000; font-weight: bold;
            padding: 15px; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 15px; text-transform: uppercase;
        }
        .btn-add:hover { background: #fff; box-shadow: 0 0 25px var(--primary); transform: translateY(-2px); }

        .table-area { overflow-x: auto; margin-top: 35px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; background: rgba(255, 255, 255, 0.98); color: #222; }
        th { background: #001d26; color: white; padding: 16px; text-align: left; text-transform: uppercase; font-size: 12px; border: none; }
        td { padding: 12px; border-bottom: 1px solid #eee; }

        .action-btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; margin-right: 4px; }
        .btn-edit { background: #ffc107; color: #000; }
        .btn-delete { background: #dc3545; color: #fff; }

        .gallery-container {
            margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px;
        }
        .gallery-item {
            background: rgba(0,0,0,0.4); padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); text-align: center;
        }
        .gallery-item img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .gallery-item p { margin: 0; font-size: 11px; color: var(--primary); font-weight: bold; }

        .footer-action { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 40px; }
        .btn-pdf { background: #d00000; color: white; flex: 2; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-reset { background: #333; color: white; flex: 1; padding: 15px; border-radius: 10px; border: none; cursor: pointer; }

        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } .container { padding: 15px; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Order List Part</h1>

    <div class="header-section">
        <input type="text" id="judulDoc" placeholder="Keterangan Tambahan (Contoh: Urgent Maintenance)">
        
        <!-- Input Unit Kapal (Bisa Dipilih / Diketik Manual) -->
        <input list="unitKapalList" id="unitAsal" placeholder="-- Pilih / Ketik Unit Kapal --">
        <datalist id="unitKapalList">
            <option value="KMP.Legundi">
            <option value="KMP.Sebuku">
            <option value="KMP.Batumandi">
            <option value="KMP.Portlink">
            <option value="KMP.Portlink III">
            <option value="KMP.Portlink V">
            <option value="KMP.Jatra III">
        </datalist>
    </div>

    <div class="form-grid">
        <input type="text" id="desc" placeholder="Deskripsi Barang" style="grid-column: span 2;">
        
        <input list="merkList" id="merk" placeholder="Merk">
        <datalist id="merkList">
            <option value="Omron"><option value="Autonics"><option value="Deepsea"><option value="Schneider">
            <option value="Siemens"><option value="Mitsubishi"><option value="ABB">
        </datalist>

        <input type="text" id="type" placeholder="Type / Model">
        <input type="number" id="qty" placeholder="Qty">
        
        <select id="satuan">
            <option value="Pcs">Pcs</option>
            <option value="Pack">Pack</option>
            <option value="Roll">Roll</option>
            <option value="Meter">Meter</option>
            <option value="Botol">Botol</option>
            <option value="Lot">Lot</option>
        </select>

        <input type="file" id="fotoFile" accept="image/*">
        
        <button class="btn-add" id="btnSubmit" onclick="addItem()">TAMBAHKAN KE DAFTAR</button>
    </div>

    <div class="table-area">
        <table>
            <thead>
                <tr>
                    <th style="width: 50px;">No</th>
                    <th>Deskripsi Barang</th>
                    <th>Merk</th>
                    <th>Type</th>
                    <th>Qty</th>
                    <th>Satuan</th>
                    <th style="width: 130px; text-align: center;">Aksi</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <h3 style="margin-top: 50px; color: var(--primary); border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; font-weight: 300;">
        Lampiran Foto Jenis/Contoh Barang yang Diminta
    </h3>
    <div id="galleryArea" class="gallery-container"></div>

    <div class="footer-action">
        <button class="btn-pdf" onclick="exportToPDF()">CETAK PDF (A4)</button>
        <button class="btn-reset" onclick="resetLog()">KOSONGKAN DATA</button>
    </div>
</div>

<script>
    let logStorage = JSON.parse(localStorage.getItem('order_list_v6')) || [];
    let editIndex = -1; // Flag untuk menandai mode edit

    window.onload = () => refreshUI();

    async function addItem() {
        const file = document.getElementById('fotoFile').files[0];
        let imgBase64 = "";

        if(file) {
            imgBase64 = await compressImg(file);
        } else if (editIndex >= 0 && logStorage[editIndex]) {
            // Gunakan foto lama jika tidak memilih file baru saat edit
            imgBase64 = logStorage[editIndex].foto || "";
        }

        const data = {
            desc: document.getElementById('desc').value,
            merk: document.getElementById('merk').value,
            type: document.getElementById('type').value,
            qty: document.getElementById('qty').value,
            satuan: document.getElementById('satuan').value,
            foto: imgBase64
        };

        if(!data.desc || !data.qty) return alert("Deskripsi dan Qty wajib diisi!");

        if (editIndex === -1) {
            // Tambah Barang Baru
            logStorage.push(data);
        } else {
            // Perbarui Barang yang Ada
            logStorage[editIndex] = data;
            editIndex = -1;
            document.getElementById('btnSubmit').innerText = "TAMBAHKAN KE DAFTAR";
            document.getElementById('btnSubmit').style.background = "var(--primary)";
        }

        localStorage.setItem('order_list_v6', JSON.stringify(logStorage));
        refreshUI();
        clearForm();
    }

    function editItem(index) {
        const item = logStorage[index];
        document.getElementById('desc').value = item.desc;
        document.getElementById('merk').value = item.merk;
        document.getElementById('type').value = item.type;
        document.getElementById('qty').value = item.qty;
        document.getElementById('satuan').value = item.satuan;

        editIndex = index;
        const btn = document.getElementById('btnSubmit');
        btn.innerText = "SIMPAN PERUBAHAN BARANG";
        btn.style.background = "#ffc107";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteItem(index) {
        if(confirm("Apakah Anda yakin ingin menghapus barang ini?")) {
            logStorage.splice(index, 1);
            localStorage.setItem('order_list_v6', JSON.stringify(logStorage));
            refreshUI();
        }
    }

    function compressImg(file) {
        return new Promise(res => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxW = 450; 
                    const scale = maxW / img.width;
                    canvas.width = maxW; canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    res(canvas.toDataURL('image/jpeg', 0.65));
                }
            }
        });
    }

    function refreshUI() {
        const tbody = document.getElementById('tableBody');
        const gall = document.getElementById('galleryArea');
        tbody.innerHTML = ""; gall.innerHTML = "";

        logStorage.forEach((it, i) => {
            tbody.innerHTML += `
                <tr>
                    <td>${i+1}</td>
                    <td><b>${it.desc}</b></td>
                    <td>${it.merk}</td>
                    <td>${it.type}</td>
                    <td>${it.qty}</td>
                    <td>${it.satuan}</td>
                    <td style="text-align: center;">
                        <button class="action-btn btn-edit" onclick="editItem(${i})">Edit</button>
                        <button class="action-btn btn-delete" onclick="deleteItem(${i})">Hapus</button>
                    </td>
                </tr>`;
            if(it.foto) {
                gall.innerHTML += `<div class="gallery-item"><img src="${it.foto}"><p>Type: ${it.type || '-'}</p></div>`;
            }
        });
    }

    function clearForm() {
        ['desc', 'merk', 'type', 'qty', 'fotoFile'].forEach(id => document.getElementById(id).value = "");
        editIndex = -1;
        const btn = document.getElementById('btnSubmit');
        btn.innerText = "TAMBAHKAN KE DAFTAR";
        btn.style.background = "var(--primary)";
    }

    function resetLog() {
        if(confirm("Hapus seluruh data order list ini?")) {
            localStorage.removeItem('order_list_v6');
            logStorage = []; 
            refreshUI();
            clearForm();
        }
    }

    function exportToPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const unit = document.getElementById('unitAsal').value || "-";
        const extra = document.getElementById('judulDoc').value;

        // Mendapatkan Tanggal, Hari, dan Jam Lengkap
        const now = new Date();
        const options = { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        };
        const formattedDate = now.toLocaleDateString('id-ID', options) + " WIB";

        // Perhitungan Ringkasan
        const totalJenisBarang = logStorage.length;
        const totalQty = logStorage.reduce((acc, curr) => acc + (Number(curr.qty) || 0), 0);

        // Header Dokumen
        doc.setFontSize(18); 
        doc.text("ORDER LIST PART", 14, 15);

        doc.setFontSize(10);
        doc.text(`Unit Kapal: ${unit}`, 14, 22);
        doc.text(`Keterangan: ${extra || "-"}`, 14, 27);
        doc.text(`Waktu Cetak: ${formattedDate}`, 14, 32);

        const rows = logStorage.map((it, i) => [i+1, it.desc, it.merk, it.type, it.qty, it.satuan]);
        
        doc.autoTable({
            startY: 38,
            head: [['No', 'Deskripsi Barang', 'Merk', 'Type', 'Qty', 'Satuan']],
            body: rows,
            headStyles: { fillColor: [0, 29, 38] },
            theme: 'grid'
        });

        // Keterangan Tambahan & Ringkasan di bagian bawah Tabel
        const finalY = doc.lastAutoTable.finalY + 10;
        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.text("Ringkasan Dokumen:", 14, finalY);
        doc.setFont("helvetica", "normal");
        doc.text(`- Total Jenis Barang : ${totalJenisBarang} Item`, 14, finalY + 6);
        doc.text(`- Total Quantity    : ${totalQty}`, 14, finalY + 11);

        // Halaman Lampiran Foto
        const photos = logStorage.filter(it => it.foto);
        if(photos.length > 0) {
            doc.addPage();
            doc.setFontSize(14); 
            doc.setFont("helvetica", "bold");
            doc.text("LAMPIRAN FOTO JENIS/CONTOH BARANG YANG DIMINTA", 14, 15);
            
            let x = 14, y = 25, w = 50, h = 40;
            photos.forEach((it) => {
                if (y + h > 280) { doc.addPage(); y = 20; }
                doc.addImage(it.foto, 'JPEG', x, y, w, h);
                doc.setFontSize(8); 
                doc.setFont("helvetica", "normal");
                doc.text(`Type: ${it.type || '-'}`, x, y + h + 5);
                x += 60; 
                if(x > 150) { x = 14; y += 60; }
            });
        }

        doc.save(`OrderPart_${unit.replace(/[^a-zA-Z0-9]/g, "_")}.pdf`);
    }
</script>
</body>
</html>
